version: '3.8'

services:
  pdf-signature-sentinel:
    build: .
    container_name: lab-pdf-signature-sentinel
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./certs:/app/certs
      - ./app:/app/app
    environment:
      - CERTS_DIR=/app/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
